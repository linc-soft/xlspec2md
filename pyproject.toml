# xlspec2md — 基本設計書 Excel → Markdown/IR 変換エンジン
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlspec2md"
version = "0.1.0"
description = "Convert 基本設計書 (Excel) into Markdown / JSON IR / mockup HTML deterministically"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
xlspec2md = "xlspec2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xlspec2md = ["dialects/*.yaml"]
